# Local parity for the deploy stack (ARCH-29): the same images the VPS runs,
# in front of the same PostgreSQL.
services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vibe_poomat}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vibe_poomat}']
      interval: 5s
      timeout: 5s
      retries: 10

  # A one-shot step, never app boot (ARCH-13); the api waits for it to succeed.
  # It shares the api's image tag on purpose, so building api also updates this
  # and a deploy can never apply migrations from an older build than it runs.
  migrate:
    image: vibe-poomat-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pg:5432/${POSTGRES_DB:-vibe_poomat}
      API_URL: http://api:3001
      WEB_URL: http://localhost:3000
    depends_on:
      pg:
        condition: service_healthy
    restart: 'no'

  api:
    image: vibe-poomat-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 3001
      API_URL: http://api:3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pg:5432/${POSTGRES_DB:-vibe_poomat}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # distroless carries no shell and no curl, so the probe is node itself
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: vibe-poomat-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
