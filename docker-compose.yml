# Local parity for the deploy stack (ARCH-29): the same images the VPS runs,
# in front of the same PostgreSQL.
services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vibe_poomat}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vibe_poomat}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local parity for the S3-compatible store: MinIO rather than a filesystem
  # stand-in, so an S3-only bug cannot wait until production to appear (ARCH-37).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      # overridable, because 9000 is a popular port to already be using
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket once MinIO is up, then exits.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID:-minioadmin}" "$${S3_SECRET_ACCESS_KEY:-minioadmin}"
        mc mb --ignore-existing "local/$${S3_BUCKET:-vibe-poomat}"
        mc anonymous set download "local/$${S3_BUCKET:-vibe-poomat}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-vibe-poomat}
    restart: 'no'

  # A one-shot step, never app boot (ARCH-13); the api waits for it to succeed.
  # It shares the api's image tag on purpose, so building api also updates this
  # and a deploy can never apply migrations from an older build than it runs.
  migrate:
    image: vibe-poomat-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pg:5432/${POSTGRES_DB:-vibe_poomat}
      API_URL: http://api:3001
      WEB_URL: http://localhost:3000
      # signs the per-type unsubscribe links (NOTI-4); a default keeps local
      # parity booting, production must set a long random value
      NOTIFICATION_SECRET: ${NOTIFICATION_SECRET:-development-notification-secret-not-for-prod}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-local-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-local-github-client-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
    depends_on:
      pg:
        condition: service_healthy
    restart: 'no'

  api:
    image: vibe-poomat-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 3001
      API_URL: http://api:3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pg:5432/${POSTGRES_DB:-vibe_poomat}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-vibe-poomat}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/vibe-poomat}
      # signs the per-type unsubscribe links (NOTI-4); a default keeps local
      # parity booting, production must set a long random value
      NOTIFICATION_SECRET: ${NOTIFICATION_SECRET:-development-notification-secret-not-for-prod}
      # NODE_ENV is production here so the stack runs the production build, which
      # also means @repo/config holds it to having OAuth credentials. Placeholders
      # keep local parity booting; put real ones in .env to sign in for real.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-local-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-local-github-client-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      # distroless carries no shell and no curl, so the probe is node itself
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: vibe-poomat-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  miniodata:
